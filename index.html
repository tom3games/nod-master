<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#16161d;--paper:#fffdf6;--navy:#1d2a4a;--navy-dk:#0e1630;--red:#d7263d;--red-dk:#8e1224;--yellow:#ffd23f;--yellow-dk:#b38a00;
  --mint:#5fd39a;--sky:#bfe3ff;--hanko:#c8102e;
  --font:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif;
}
html{background:var(--navy);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
body{overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,canvas{touch-action:manipulation}
button{font-family:inherit;color:inherit;font-size:inherit;font-weight:800}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#shake{position:fixed;inset:0;z-index:0}

/* まぶた（眠気で上下から閉じる） */
#lids{position:fixed;inset:0;z-index:2;pointer-events:none}
#lids i{position:absolute;left:-5%;right:-5%;height:0;background:#0a0a10;transition:height .12s linear}
#lids .t{top:0;border-radius:0 0 50% 50%/0 0 40px 40px}
#lids .b{bottom:0;border-radius:50% 50% 0 0/40px 40px 0 0}
#flash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(transparent 40%,rgba(215,38,61,.7))}
#flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

.view{position:fixed;inset:0;height:100svh;overflow:hidden;z-index:5;display:flex;flex-direction:column;align-items:center;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px))) max(16px,env(safe-area-inset-left))}

/* ボタン */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:.04em;border:3px solid var(--ink);border-radius:16px;min-height:56px;padding:0 20px;cursor:pointer;width:100%;
  background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.red{background:var(--red);color:#fff;font-size:21px;min-height:62px}
.btn.yellow{background:var(--yellow)}
.btn.ghost{background:rgba(255,253,246,.88);font-size:16px;min-height:48px}
.btn.xpost{background:#000;color:#fff}
.btn svg.xlogo{fill:currentColor;stroke:none;width:20px;height:20px}
.row{display:flex;gap:10px;width:100%}
.row>.btn{flex:1;min-width:0;padding:0 10px;white-space:nowrap;letter-spacing:0}
.resBtns .row>.btn{font-size:16px}

#corner{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:50;display:flex;gap:8px}
#corner button{height:40px;min-width:44px;padding:0 10px;border-radius:12px;border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
#corner button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#corner svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- タイトル */
#vTitle{justify-content:space-between;gap:10px;padding-top:max(58px,calc(env(safe-area-inset-top) + 50px))}
.logo{text-align:center;line-height:.95;transform:rotate(-4deg);filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.logo .l1,.logo .l2{display:block;font-weight:900;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;letter-spacing:.02em}
.logo .l1{font-size:min(15vw,9vh,84px);color:var(--yellow)}
.logo .l2{font-size:min(17vw,10.5vh,100px);color:#fff;text-shadow:6px 6px 0 var(--red)}
.logo .sub{display:inline-block;margin-top:14px;font-weight:900;font-size:clamp(13px,3.6vw,17px);padding:7px 14px;border-radius:10px;background:var(--paper);border:3px solid var(--ink);transform:rotate(2deg);max-width:92vw;line-height:1.4}
.tBottom{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.credit{text-align:center;font-size:11px;color:rgba(255,255,255,.75);font-weight:700}

/* ---------- 遊び方 */
#vHow{justify-content:center;background:rgba(14,22,48,.55)}
.panel{width:min(560px,100%);max-height:100%;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:clamp(12px,2.4vh,20px);box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:clamp(6px,1.4vh,12px);min-height:0}
.panel h2{font-weight:900;font-size:clamp(20px,3.4vh,26px);display:flex;align-items:center;gap:8px}
.panel h2 svg{width:28px;height:28px;stroke:var(--red);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.steps{display:flex;flex-direction:column;gap:clamp(4px,1.1vh,10px);min-height:0}
.step{display:grid;grid-template-columns:clamp(34px,6vh,48px) 1fr;gap:10px;align-items:center;font-weight:700;font-size:clamp(12px,1.95vh,15px);line-height:1.5}
.step svg{width:100%;height:auto;aspect-ratio:1}
.step b{color:var(--red)}
.goal{font-weight:900;font-size:clamp(12px,1.9vh,15px);background:var(--yellow);border-radius:10px;padding:6px 10px;text-align:center}

/* ---------- プレイ */
#vPlay{padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px))) max(10px,env(safe-area-inset-left));gap:8px;cursor:pointer}
.hud{width:100%;max-width:760px;display:flex;gap:8px;padding-right:58px;align-items:center}
.meter{flex:1;display:flex;align-items:center;gap:6px;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:4px 8px;height:40px;box-shadow:0 3px 0 var(--ink);min-width:0}
.meter svg{width:26px;height:26px;flex:none}
.meter .lab{font-size:10px;font-weight:900;white-space:nowrap}
.bar{flex:1;height:12px;border-radius:7px;background:#e4dfd2;border:2px solid var(--ink);overflow:hidden;min-width:30px}
.bar i{display:block;height:100%;width:50%;background:var(--navy);transition:width .2s}
#moodBar i{background:var(--mint)}
#moodBar.mid i{background:var(--yellow)}
#moodBar.low i{background:var(--red)}
.bubble{position:relative;width:100%;max-width:760px;background:#fff;border:3.5px solid var(--ink);border-radius:22px;padding:10px 16px;height:calc(1.5em * 3 + 26px);overflow:visible;font-weight:900;font-size:clamp(16px,4.6vw,22px);line-height:1.5;box-shadow:0 5px 0 var(--ink)}
.bubble .who{position:absolute;left:14px;top:-13px;background:var(--navy);color:#fff;font-size:12px;padding:2px 10px;border-radius:8px;border:2px solid var(--ink)}
.bubble::after{content:"";position:absolute;bottom:-20px;left:var(--tail,70%);width:26px;height:22px;background:#fff;border-right:3.5px solid var(--ink);border-bottom:3.5px solid var(--ink);transform:skewX(-35deg) rotate(10deg);transform-origin:0 0;border-radius:0 0 6px 0}
.bubble .cue{color:var(--red);font-size:1.12em}
.bubble .cue.done{display:inline-block;animation:cuePop .25s cubic-bezier(.3,1.8,.5,1)}
@keyframes cuePop{from{transform:scale(1.5)}to{transform:none}}
.bubble.angry{background:#ffe1e1;animation:shakeX .08s linear 6}
.bubble.ask{background:#fff6c9}
@keyframes shakeX{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
#stageBox{flex:1;width:100%;min-height:0;pointer-events:none}
.ctrl{width:100%;max-width:760px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sleepBox{flex:1;max-width:260px;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:8px}
.sleepBox svg{width:30px;height:30px;flex:none}
.sleepBox .lab{font-size:11px;font-weight:900}
#sleepBar i{background:linear-gradient(90deg,#7c8cff,#4a2a8a)}
#sleepBar.hot i{background:linear-gradient(90deg,#b57cff,#d7263d);animation:blink .4s steps(2) infinite}
@keyframes blink{50%{opacity:.5}}
.nodWrap{position:relative;width:clamp(92px,25vw,120px);aspect-ratio:1;flex:none;margin:0 30px 26px 0}
#bNod{position:absolute;inset:0;border-radius:50%;border:4px solid var(--ink);background:var(--yellow);box-shadow:0 6px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:13px;font-weight:900;letter-spacing:.06em}
#bNod svg{width:52%;height:52%}
#bNod.hit{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#ring{position:absolute;inset:-4px;border-radius:50%;border:5px solid var(--red);pointer-events:none;opacity:0}
#ring.near{border-color:var(--mint)}
.nodHint{position:absolute;bottom:calc(100% + 6px);right:0;white-space:nowrap;font-size:11px;font-weight:900;color:#fff;background:rgba(14,22,48,.8);padding:3px 8px;border-radius:8px}
#wake{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);z-index:12;font-weight:900;font-size:clamp(28px,8vw,52px);color:var(--yellow);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;white-space:nowrap;pointer-events:none;animation:wake .3s ease-in-out infinite alternate}
@keyframes wake{to{transform:translate(-50%,-50%) rotate(4deg) scale(1.1)}}
.pop{position:fixed;z-index:11;pointer-events:none;font-weight:900;white-space:nowrap;transform:translate(-50%,-100%);font-size:clamp(16px,4.4vw,24px);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;color:#fff;animation:pop 1.1s ease-out forwards}
.pop.perfect{color:var(--yellow);font-size:clamp(20px,5.6vw,30px)}
.pop.good{color:#fff}
.pop.bad{color:#ff8a8a}
.pop.boss{color:#fff;background:var(--red);-webkit-text-stroke:0;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-size:clamp(14px,3.8vw,20px)}
.pop.judge{font-size:clamp(14px,3.6vw,18px);letter-spacing:.08em}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-70%) scale(.6)}15%{opacity:1;transform:translate(-50%,-110%) scale(1.15)}30%{transform:translate(-50%,-110%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%)}}

/* 2択 */
body.asking .nodWrap{visibility:hidden}
#ask{position:fixed;left:0;right:0;bottom:0;z-index:14;padding:12px max(12px,env(safe-area-inset-right)) max(14px,calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px))) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(transparent,rgba(14,22,48,.75) 30%);cursor:default}
#ask .tbar{width:min(560px,100%);height:12px;border-radius:7px;background:rgba(255,255,255,.3);border:2px solid var(--ink);overflow:hidden}
#ask .tbar i{display:block;height:100%;background:var(--yellow);width:100%}
#ask .row{width:min(560px,100%)}
html[lang=en] #ask .btn{overflow-wrap:normal;word-break:normal}
#ask .btn{white-space:normal;min-height:64px;font-size:clamp(14px,4vw,18px);line-height:1.3;padding:6px 10px;letter-spacing:0}
#ask .btn .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}

/* ---------- 結果 */
#vResult{justify-content:flex-end;gap:10px;background:linear-gradient(transparent 35%,rgba(14,22,48,.55));padding-top:max(56px,calc(env(safe-area-inset-top) + 50px))}
#announce{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(14,22,48,.82);color:#fff;text-align:center}
#announce .a1{font-weight:900;font-size:clamp(28px,8vw,56px);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;color:var(--yellow);transform:rotate(-3deg)}
#announce .a2{font-weight:900;font-size:18px;opacity:.9;animation:blink .5s steps(2) infinite}
.resWrap{width:min(520px,100%);display:flex;flex-direction:column;gap:10px;min-height:0;max-height:100%}
.cert{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 7px 0 var(--ink);padding:12px 16px 12px}
.cert::before{content:"";position:absolute;inset:6px;border:2px solid #b89a4a;border-radius:11px;pointer-events:none}
.cert h3{text-align:center;font-weight:900;font-size:clamp(15px,2.5vh,20px);letter-spacing:.2em;color:#6b4e12}
.certTop{display:flex;align-items:center;gap:8px;margin-top:2px}
.certTop>div{flex:1;min-width:0}
.cert .ttl{font-weight:900;font-size:clamp(20px,3.6vh,28px);line-height:1.25}
.cert .you{font-size:12px;font-weight:700;color:#555}
.stats{margin-top:6px;display:grid;grid-template-columns:1fr auto 1fr auto;gap:2px 10px;font-weight:700;font-size:clamp(12px,1.8vh,14px);border-top:2px dashed #d8cba4;padding-top:6px}
.stats b{font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.stats .neg{color:var(--red)}
#hanko{flex:none;width:clamp(92px,15vh,128px);aspect-ratio:1;transform:rotate(-14deg);opacity:0}
#hanko.on{animation:hanko .45s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes hanko{0%{opacity:0;transform:rotate(-14deg) scale(3)}60%{opacity:1;transform:rotate(-14deg) scale(.92)}100%{opacity:.92;transform:rotate(-14deg) scale(1)}}
.bossCmt{display:flex;gap:10px;align-items:center}
.bossCmt svg{width:clamp(48px,8vh,64px);flex:none}
.bossCmt p{position:relative;flex:1;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:900;font-size:clamp(13px,2.1vh,16px);line-height:1.5;box-shadow:0 4px 0 var(--ink)}
.bossCmt p::before{content:"";position:absolute;left:-11px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:11px solid var(--ink);border-left:0}
.resBtns{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;font-weight:900;padding:10px 18px;border-radius:12px}

/* 小さい縦画面 */
@media (max-height:700px) and (max-aspect-ratio:1/1){
  .btn{min-height:48px;font-size:16px}.btn.red{min-height:54px;font-size:19px}
  .bubble{font-size:clamp(14px,4.2vw,18px);padding:8px 12px;height:calc(1.5em * 3 + 22px)}
  .cert{padding:10px 12px 8px}
  .resBtns .btn{min-height:44px}
  .stats{font-size:12px}
}
/* X のアプリの中: 下の帯（--inapp-bot）の分だけ結果を詰める */
@media (max-height:700px) and (max-aspect-ratio:1/1){
  html.inapp-x #vResult{gap:6px;padding-top:max(50px,calc(env(safe-area-inset-top) + 44px))}
  html.inapp-x .resWrap{gap:6px}
  html.inapp-x .cert{padding:8px 12px 6px}
  html.inapp-x #hanko{width:clamp(72px,12vh,96px)}
  html.inapp-x .bossCmt svg{width:40px}
  html.inapp-x .bossCmt p{font-size:12px;padding:6px 10px;line-height:1.4}
  html.inapp-x .resBtns{gap:6px}
  html.inapp-x .resBtns .btn{min-height:40px}
  html.inapp-x .resBtns .btn.red{min-height:46px;font-size:18px}
}
@media (max-height:620px) and (max-aspect-ratio:1/1){
  html.inapp-x .cert h3{display:none}
  html.inapp-x .bossCmt p{padding:4px 8px}
}
/* 背の低い横画面 */
@media (max-height:560px) and (min-aspect-ratio:1/1){
  #vTitle{align-items:flex-start;justify-content:space-between;padding-top:max(14px,env(safe-area-inset-top))}
  .logo{width:min(400px,46vw);margin-left:4px}
  .logo .l1{font-size:min(7vw,14vh,60px)}.logo .l2{font-size:min(8.4vw,16.5vh,72px)}
  .logo .sub{font-size:13px;margin-top:10px}
  .tBottom{width:min(320px,44vw);gap:8px}
  .btn{min-height:46px;font-size:16px}.btn.red{min-height:50px;font-size:18px}
  .step{grid-template-columns:30px 1fr;font-size:12px;line-height:1.4}
  #vHow .panel{padding:10px 14px;gap:6px}
  .panel h2{font-size:18px}.panel h2 svg{width:22px;height:22px}
  .goal{font-size:12px;padding:4px 8px}
  .hud{max-width:none}
  .bubble{max-width:none;font-size:clamp(14px,2.6vw,19px);padding:6px 14px;height:calc(1.5em * 2 + 18px)}
  .ctrl{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(8px,calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)));width:auto;max-width:none;pointer-events:none}
  .ctrl>*{pointer-events:auto}
  .sleepBox{max-width:220px}
  .nodWrap{width:min(88px,22vh);margin:0 24px 18px 0}
  #vResult{padding-top:max(10px,env(safe-area-inset-top));align-items:flex-start;justify-content:center;background:linear-gradient(90deg,rgba(14,22,48,.55),transparent 60%)}
  .resWrap{width:min(440px,54vw);gap:7px}
  .cert{padding:8px 12px}
  .cert h3{font-size:14px}
  .cert .ttl{font-size:clamp(16px,4.6vh,22px)}
  #hanko{width:min(84px,22vh)}
  .stats{font-size:11px;margin-top:3px;padding-top:3px}
  .bossCmt svg{width:40px}.bossCmt p{font-size:12px;padding:5px 10px}
  .resBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
  .resBtns .row{display:contents}
  #bAgain{grid-area:1/1}#bTitle{grid-area:1/2}#bSave{grid-area:2/1}#bX{grid-area:2/2}
  .resBtns .btn{min-height:40px;font-size:13px;padding:0 6px;gap:4px;white-space:nowrap;letter-spacing:0}
  .resBtns .btn.red{min-height:40px;font-size:15px}
  .resBtns .btn svg{width:18px;height:18px}.resBtns .btn svg.xlogo{width:15px;height:15px}
}
</style>

<body>
<div id="shake"><canvas id="gl"></canvas></div>
<div id="lids"><i class="t"></i><i class="b"></i></div>
<div id="flash"></div>

<div id="corner">

  <button id="bMute" aria-label="sound"><svg id="icOn" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg><svg id="icOff" viewBox="0 0 24 24" hidden><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg></button>
</div>

<!-- タイトル -->
<main id="vTitle" class="view" hidden>

  <div class="tBottom">
    <button class="btn red" id="bStart"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V9h12v11M9 9V5h6v4"/></svg><span data-t="start"></span></button>
    <button class="btn ghost" id="bHow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg><span data-t="how"></span></button>
    <div class="credit">tom3games</div>
  </div>
</main>

<!-- 遊び方 -->
<main id="vHow" class="view" hidden>
  <div class="panel">
    <h2><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-t="howTitle"></span></h2>
    <div class="steps">
      <div class="step"><svg viewBox="0 0 48 48"><circle cx="24" cy="22" r="13" fill="#f2c19b" stroke="#16161d" stroke-width="3"/><path d="M18 20h3M27 20h3" stroke="#16161d" stroke-width="3" stroke-linecap="round"/><path d="M19 27q5 4 10 0" fill="none" stroke="#16161d" stroke-width="3" stroke-linecap="round"/><path d="M40 10q4 8 0 16M8 10q-4 8 0 16" fill="none" stroke="#d7263d" stroke-width="3" stroke-linecap="round"/><path d="M24 38v6" stroke="#16161d" stroke-width="3"/></svg><span id="how1"></span></div>
      <div class="step"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="12" fill="#ffd23f" stroke="#16161d" stroke-width="3"/><circle cx="24" cy="24" r="20" fill="none" stroke="#d7263d" stroke-width="3" stroke-dasharray="4 4"/><path d="M24 2v6M24 40v6" stroke="#d7263d" stroke-width="3"/></svg><span data-t="how2" data-html="1"></span></div>
      <div class="step"><svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="14" fill="#f2c19b" stroke="#16161d" stroke-width="3"/><path d="M15 24q4-3 7 0M26 24q4-3 7 0" fill="none" stroke="#16161d" stroke-width="3" stroke-linecap="round"/><circle cx="31" cy="32" r="5" fill="#bfe3ff" stroke="#16161d" stroke-width="2"/><path d="M30 4h8l-8 8h8" fill="none" stroke="#4a2a8a" stroke-width="3" stroke-linejoin="round"/></svg><span data-t="how3" data-html="1"></span></div>
      <div class="step"><svg viewBox="0 0 48 48"><rect x="3" y="12" width="19" height="24" rx="5" fill="#fffdf6" stroke="#16161d" stroke-width="3"/><rect x="26" y="12" width="19" height="24" rx="5" fill="#fffdf6" stroke="#16161d" stroke-width="3"/><path d="M9 24h7M32 24h7" stroke="#16161d" stroke-width="3" stroke-linecap="round"/><path d="M24 4v4" stroke="#d7263d" stroke-width="3" stroke-linecap="round"/></svg><span data-t="how4" data-html="1"></span></div>
    </div>
    <div class="goal" data-t="howGoal"></div>
    <div class="row"><button class="btn ghost" id="bHowBack"><span data-t="back"></span></button><button class="btn red" id="bHowGo"><span data-t="ok"></span></button></div>
  </div>
</main>

<!-- プレイ -->
<main id="vPlay" class="view" hidden>
  <div class="hud">
    <div class="meter"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="#fff" stroke="#16161d" stroke-width="2.5"/><path d="M13 7v6l4 3" fill="none" stroke="#16161d" stroke-width="2.5" stroke-linecap="round"/></svg><span class="lab" data-t="meeting"></span><div class="bar" id="timeBar"><i></i></div></div>
    <div class="meter"><svg viewBox="0 0 26 26" id="moodFace"></svg><span class="lab" data-t="mood"></span><div class="bar" id="moodBar"><i></i></div></div>
  </div>
  <div class="bubble" id="bubble"><span class="who" data-t="bossName"></span><span id="btext"></span></div>
  <div id="stageBox"></div>
  <div class="ctrl">
    <div class="sleepBox"><svg viewBox="0 0 30 30"><path d="M22 18A9 9 0 1 1 12 6a7 7 0 0 0 10 12z" fill="#ffd23f" stroke="#16161d" stroke-width="2.4" stroke-linejoin="round"/><path d="M19 4h5l-5 5h5" fill="none" stroke="#4a2a8a" stroke-width="2.2" stroke-linejoin="round"/></svg><span class="lab" data-t="sleep"></span><div class="bar" id="sleepBar"><i></i></div></div>
    <div class="nodWrap"><span class="nodHint" id="nodHint"></span><div id="ring"></div><button id="bNod" aria-label="nod"><svg viewBox="0 0 48 48"><circle cx="24" cy="22" r="12" fill="#f2c19b" stroke="#16161d" stroke-width="3"/><path d="M18 21h3M27 21h3" stroke="#16161d" stroke-width="3" stroke-linecap="round"/><path d="M20 27q4 3 8 0" fill="none" stroke="#16161d" stroke-width="2.6" stroke-linecap="round"/><path d="M40 12q3 6 0 13M8 12q-3 6 0 13" fill="none" stroke="#16161d" stroke-width="3" stroke-linecap="round"/><path d="M20 40l4 5 4-5" fill="none" stroke="#d7263d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="nodLab"></span></button></div>
  </div>
  <div id="ask" hidden>
    <div class="tbar"><i id="askBar"></i></div>
    <div class="row"><button class="btn" id="bA0"><span class="k">1</span><span></span></button><button class="btn" id="bA1"><span class="k">2</span><span></span></button></div>
  </div>
</main>
<div id="wake" data-t="wakeUp" hidden></div>

<!-- 結果 -->
<main id="vResult" class="view" hidden>
  <div class="resWrap">
    <div class="cert">
      <h3 data-t="resultHead"></h3>
      <div class="certTop"><div><div class="you" data-t="you"></div><div class="ttl" id="rTitle"></div></div><svg id="hanko" viewBox="0 0 200 200"></svg></div>
      <div class="stats" id="rStats"></div>
    </div>
    <div class="bossCmt"><svg viewBox="0 0 64 64" id="rFace"></svg><p id="rCmt"></p></div>
    <div class="resBtns">
      <button class="btn red" id="bAgain"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg><span data-t="again"></span></button>
      <div class="row">
        <button class="btn yellow" id="bSave"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-t="save"></span></button>
        <button class="btn xpost" id="bX" type="button"><svg class="xlogo" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg><span data-t="xPost"></span></button>
      </div>
      <button class="btn ghost" id="bTitle"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg><span data-t="toTitle"></span></button>
    </div>
  </div>
</main>
<div id="announce" hidden><div class="a1" data-t="announce"></div><div class="a2" data-t="judging"></div></div>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__nmReady) return;
    var d=document.createElement('div');d.id='boot-err';d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px;border-radius:8px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },6000);
})();
</script>
